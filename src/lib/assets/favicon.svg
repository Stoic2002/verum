<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="VERUM">
	<!--
		One letter, cut as a wedge rather than drawn as a stroke: at 16 pixels a
		stroked V loses its join and reads as a check mark. The tile carries the
		brand blue (PLAN-DEV §O) so the mark stays legible on a white tab bar and
		on a dark one, without needing two files.
	-->
	<defs>
		<linearGradient id="v" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#2E6BE0" />
			<stop offset="1" stop-color="#1246A5" />
		</linearGradient>
	</defs>
	<rect width="64" height="64" rx="14" fill="url(#v)" />
	<path d="M13 16h13l6 23.5L38 16h13L32 50Z" fill="#fff" />
</svg>
